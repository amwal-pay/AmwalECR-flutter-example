# Example overrides for the iOS plugin's ios/ecr_sdk.properties.
# Same keys as amwal-ecr-flutter/example/ios/ecr_sdk.properties.
#
# Paths are relative to this file (AmwalECR-flutter-example/ios/).
#
#   project   — local AmwalECR-iOS-CocoaPods (CocoaPods face) /
#               local AmwalECR-iOS-SPM (Package.swift face)
#   cocoapods — CocoaPods trunk
#   spm       — GitHub SwiftPM (enables Flutter Swift Package Manager)
#
# One-off: ECR_SDK_DEPENDENCY=cocoapods flutter run
ecrSdkDependency=cocoapods
ecrSdkVersion=0.2.3
ecrSdkCocoaPodsRoot=../../AmwalECR-iOS-CocoaPods
ecrSdkSpmRoot=../../AmwalECR-iOS-SPM
