# Local ECR SDK — mirrors amwal-ecr-flutter/example/android/gradle.properties.
# Paths are relative to this file (AmwalECR-flutter-example/android/).
#   maven   — com.amwal-pay:ecr-sdk from Maven Central (plugin default)
#   project — sibling :ecr-sdk Gradle module
#   jar     — pre-built JAR from the ECR-simulator checkout
ecrSdkDependency=maven
ecrSdkRoot=../../ECR-simulator

org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
